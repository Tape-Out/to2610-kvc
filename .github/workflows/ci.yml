name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  ip:
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 整片测试：ran asic 用 sv2v 与 yosys 展平出交付的 .v，测试台跑在 Verilator 上，程序用裸机的 RISC-V GCC 编；
      # Linux 镜像先在 QEMU 上过一遍
      apt: yosys verilator gcc-riscv64-unknown-elf qemu-system-riscv
      pip: pyyaml
      sv2v: v0.0.13
      # linux 段起到 shell 时存的断点连同仿真器交给下一个作业：一个作业放不下起 Linux 再跑各层
      keep: build/ckpt
  linux-sdcard:
    needs: ip
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator gcc-riscv64-unknown-elf
      pip: pyyaml
      sv2v: v0.0.13
      tasks: linux-sdcard
      restore: build/ckpt
      stage: linux-sdcard
  linux-network:
    needs: ip
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator gcc-riscv64-unknown-elf
      pip: pyyaml
      sv2v: v0.0.13
      tasks: linux-network
      restore: build/ckpt
      stage: linux-network
  linux-netjoin:
    needs: ip
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 联调那一段要 switch 与 router 的联合仿真：iverilog 加 cocotb
      apt: yosys verilator iverilog gcc-riscv64-unknown-elf
      pip: pyyaml cocotb==1.9.2
      sv2v: v0.0.13
      tasks: linux-netjoin
      restore: build/ckpt
      stage: linux-netjoin
  linux-netinet:
    needs: ip
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 联调那一段要 switch 与 router 的联合仿真：iverilog 加 cocotb
      apt: yosys verilator iverilog gcc-riscv64-unknown-elf
      pip: pyyaml cocotb==1.9.2
      sv2v: v0.0.13
      tasks: linux-netinet
      restore: build/ckpt
      stage: linux-netinet
  linux-gpu:
    needs: ip
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 仿真器是前一个作业编好的（带着整颗 gpu）；yosys 与 sv2v 给每个作业开头都要跑的 setup 用
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      tasks: linux-gpu
      restore: build/ckpt
      stage: linux-gpu
